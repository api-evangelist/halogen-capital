aid: halogen-capital
name: Halogen Capital
description: >-
  Halogen Capital is Malaysia's first and only licensed digital asset fund
  manager, regulated by the Securities Commission Malaysia (License
  eCMSL/A0388/2023) and headquartered in Kuala Lumpur. The firm gives
  high-net-worth individuals, family offices, corporates, and institutional
  investors regulated access to cryptocurrency and traditional assets through
  unit trust structures, offering Shariah-compliant Bitcoin, Ethereum, and
  Crypto Titans basket funds alongside a MYR liquid fund, a ringgit income
  fund, and an enhanced income fund, all secured with multi-signature custody.
  Backed by Kenanga Investment Bank and 500 Global, Halogen manages roughly
  RM400 million in assets under management and is expanding into real-world
  asset (RWA) tokenization. This API Evangelist profile currently tracks the
  company's public web presence and domain-security posture; no public
  developer API surface was found during enrichment.
